onboarding = false

[remote]
manage_ssh_config = false

[keys]
# tmux defaults: % = side-by-side, " = stacked (literal chars; TOML literal strings)
split_vertical   = 'prefix+%'
split_horizontal = 'prefix+"'

# macos alt=opt
#switch_workspace = "prefix+alt+1..9"
switch_workspace = "alt+1..9"
next_workspace = "alt+n"
previous_workspace = "alt+p"
previous_tab = "" # Disable the built-in positional previous-tab action.

command = [
  { key = "prefix+ctrl+c", type = "shell", command = "workspace=$(herdr workspace list | jq -er '.result.workspaces[] | select(.label == \"Chief\") | .workspace_id') && herdr workspace focus \"$workspace\"", description = "Focus Chief workspace" },
  ## for https://github.com/lmilojevicc/herdr-splits.nvim
  { key = "ctrl+h", type = "plugin_action", command = "herdr-splits.nav-left" },
  { key = "ctrl+j", type = "plugin_action", command = "herdr-splits.nav-down" },
  { key = "ctrl+k", type = "plugin_action", command = "herdr-splits.nav-up" },
  { key = "ctrl+l", type = "plugin_action", command = "herdr-splits.nav-right" },
  { key = "alt+h",  type = "plugin_action", command = "herdr-splits.resize-left" },
  { key = "alt+j",  type = "plugin_action", command = "herdr-splits.resize-down" },
  { key = "alt+k",  type = "plugin_action", command = "herdr-splits.resize-up" },
  { key = "alt+l",  type = "plugin_action", command = "herdr-splits.resize-right" },
  ## for https://github.com/ChmaraX/herdr-nvim
  { key = "prefix+e", type = "plugin_action", command = "chmarax.herdr-nvim.toggle", description = "Toggle Neovim sidebar" },
  { key = "prefix+o", type = "plugin_action", command = "chmarax.herdr-nvim.pick-file", description = "Open file from agent output" },
  ## for https://github.com/third774/herdr-last-workspace
  { key = "prefix+tab", type = "plugin_action", command = "third774.last-workspace.toggle", description = "Switch to last workspace" },
  ## for https://github.com/beyondlex/herdr-recent-navigator
  { key = "prefix+p", type = "plugin_action", command = "beyondlex.herdr-recent-navigator.focus-previous-tab", description = "Toggle previous tab" },
]

[theme]
name = "one-dark"
auto_switch = false

[experimental]
kitty_graphics = true
pane_history = true

[ui]
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = true
pane_gaps = false

show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"]
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [
    { token = "agent", bold = true },
    { token = "state_text", dim = true, rules = [
      { contains = "blocked", ignore_case = true, fg = "#e06c75", bold = true, dim = false },
      { contains = "approval", ignore_case = true, fg = "#e06c75", bold = true, dim = false },
      { contains = "question", ignore_case = true, fg = "#e5c07b", bold = true, dim = false },
      { contains = "working", ignore_case = true, fg = "#61afef", dim = false },
      { contains = "done", ignore_case = true, fg = "#98c379", bold = true, dim = false },
    ] },
  ],
]

[terminal]
shell_mode = "login"

[ui.toast]
delivery = "off"
