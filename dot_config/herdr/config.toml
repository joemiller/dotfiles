onboarding = false
[keys]
# tmux defaults: % = side-by-side, " = stacked (literal chars; TOML literal strings)
split_vertical   = 'prefix+%'
split_horizontal = 'prefix+"'

# macos alt=opt
#switch_workspace = "prefix+alt+1..9"
switch_workspace = "alt+1..9"
next_workspace = "alt+n"
previous_workspace = "alt+p"

command = [
  ## for https://github.com/lmilojevicc/herdr-splits.nvim
  { key = "ctrl+h", type = "plugin_action", command = "herdr-splits.nav-left" },
  { key = "ctrl+j", type = "plugin_action", command = "herdr-splits.nav-down" },
  { key = "ctrl+k", type = "plugin_action", command = "herdr-splits.nav-up" },
  { key = "ctrl+l", type = "plugin_action", command = "herdr-splits.nav-right" },
  { key = "alt+h",  type = "plugin_action", command = "herdr-splits.resize-left" },
  { key = "alt+j",  type = "plugin_action", command = "herdr-splits.resize-down" },
  { key = "alt+k",  type = "plugin_action", command = "herdr-splits.resize-up" },
  { key = "alt+l",  type = "plugin_action", command = "herdr-splits.resize-right" },
  ## for https://github.com/third774/herdr-last-workspace
  { key = "prefix+tab", type = "plugin_action", command = "third774.last-workspace.toggle", description = "Switch to last workspace" },
]

[theme]
name = "one-dark"
auto_switch = false

[experimental]
kitty_graphics = true
pane_history = true

[ui]
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = true
pane_gaps = false

show_agent_labels_on_pane_borders = true
[terminal]
shell_mode = "login"

[ui.toast]
delivery = "off"
